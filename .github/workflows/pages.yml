name: Pages

on:
  push:
    branches: [ main ]
    paths: [ "site/**", "icon/spaces.svg", "docs/images/menu.png" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Point spaces.gustaf.dev at GitHub Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zone=$(curl -fsS -H "$auth" "$api/zones?name=gustaf.dev" | jq -r '.result[0].id')
          count=$(curl -fsS -H "$auth" "$api/zones/$zone/dns_records?name=spaces.gustaf.dev" | jq '.result | length')
          [ "$count" = "0" ] || exit 0
          curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" "$api/zones/$zone/dns_records" \
            -d '{"type":"CNAME","name":"spaces","content":"gustaferiksson.github.io","proxied":false}' > /dev/null

      - name: Assemble the page
        run: mkdir _site && cp site/index.html icon/spaces.svg docs/images/menu.png _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
