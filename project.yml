name: Spaces
options:
  bundleIdPrefix: dev.gustaf
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SpacesCore:
    path: Packages/SpacesCore

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  Spaces:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # XcodeGen has no `resources` key; the asset catalog must be listed as a source.
      - path: Resources/Assets.xcassets
    dependencies:
      - package: SpacesCore
    settings:
      base:
        PRODUCT_NAME: Spaces
        PRODUCT_BUNDLE_IDENTIFIER: dev.gustaf.Spaces
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ARCHS: arm64
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Spaces
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "27.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Spaces"
        CFBundleURLTypes:
          - CFBundleURLName: dev.gustaf.Spaces
            CFBundleURLSchemes: [spaces]
